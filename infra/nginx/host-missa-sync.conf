server {
    listen 80;
    server_name missal.flowdigitalstudio.com.br api-missal.flowdigitalstudio.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl http2;
    server_name missal.flowdigitalstudio.com.br;

    ssl_certificate /etc/letsencrypt/live/missa-edge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/missa-edge/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:9021;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:9020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 8443 ssl http2;
    server_name api-missal.flowdigitalstudio.com.br;

    ssl_certificate /etc/letsencrypt/live/missa-edge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/missa-edge/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }

    location = /health {
        proxy_pass http://127.0.0.1:9021/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:9021;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

